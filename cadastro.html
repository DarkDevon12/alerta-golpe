<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - AlertaGolpe</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <div class="auth-container">

    <div class="auth-box auth-box-wide">

      <div class="auth-header">
        <h1>AlertaGolpe</h1>
        <p>Crie sua conta e comece a proteger-se</p>
      </div>

      <!-- Cadastro com Google -->
      <button id="btn-google" type="button" class="btn-auth btn-google">
        <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Cadastrar com Google
      </button>

      <div class="auth-divider">
        <span>Ou continue com email</span>
      </div>

      <form id="form-cadastro" class="auth-form">

        <div class="form-group">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="Seu nome completo" required>
        </div>

        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" placeholder="000.000.000-00" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Crie uma senha segura" required>
        </div>

        <div class="form-group">
          <label for="confirmar-senha">Confirmar senha</label>
          <input type="password" id="confirmar-senha" placeholder="Digite novamente" required>
        </div>

        <div class="requisitos-senha">
          <p>Requisitos da senha:</p>
          <ul>
            <li id="req-maiuscula" class="req-item">Letra MAIÚSCULA</li>
            <li id="req-minuscula" class="req-item">Letra minúscula</li>
            <li id="req-numero" class="req-item">Um número</li>
            <li id="req-simbolo" class="req-item">Um símbolo (!@#$%^&*)</li>
            <li id="req-tamanho" class="req-item">Mínimo 8 caracteres</li>
          </ul>
        </div>

        <button type="submit" class="btn-auth btn-primary" id="btn-cadastro" disabled>Criar conta</button>

      </form>

      <div class="auth-divider">
        <span>Já tem conta?</span>
      </div>

      <a href="login.html" class="btn-auth btn-secondary">Voltar para login</a>

    </div>

    <div class="auth-footer">
      <p>AlertaGolpe © 2024 — Combatendo golpes digitais</p>
    </div>

  </div>

  <!-- Scripts na ordem correta -->
  <script type="module" src="js/cadastro.js"></script>
  <script type="module" src="js/auth-google.js"></script>

</body>
</html>
