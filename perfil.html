<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil — AlertaGolpe</title>
  <script>try{var t=localStorage.getItem("alertagolpe:tema");if(t&&t!=="escuro")document.documentElement.dataset.tema=t}catch(e){}</script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0a0f1e">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark"><svg class="icon" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg></span>
        AlertaGolpe
      </a>
      <nav class="nav">
        <a href="index.html"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>Verificar</a>
        <a href="denunciar.html"><svg class="icon" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>Denunciar</a>
        <a href="ranking.html"><svg class="icon" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Ranking</a>
      </nav>
      <div class="topbar-user">
        <span id="nav-usuario"></span>
        <button id="btn-sair" class="btn-sair" type="button"><svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>Sair</button>
      </div>
    </div>
  </header>

  <main class="page perfil">

    <section class="card perfil-cab" id="perfil-cab">
      <p class="placar-msg">Carregando perfil…</p>
    </section>

    <div class="abas" role="tablist" aria-label="Seções do perfil">
      <button type="button" role="tab" id="tab-geral" data-aba="geral" aria-controls="aba-geral" aria-selected="true">Visão geral</button>
      <button type="button" role="tab" id="tab-loja" data-aba="loja" aria-controls="aba-loja" aria-selected="false">Loja</button>
      <button type="button" role="tab" id="tab-denuncias" data-aba="denuncias" aria-controls="aba-denuncias" aria-selected="false">Denúncias</button>
    </div>

    <section class="aba" id="aba-geral" role="tabpanel" aria-labelledby="tab-geral"></section>
    <section class="aba" id="aba-loja" role="tabpanel" aria-labelledby="tab-loja" hidden></section>
    <section class="aba" id="aba-denuncias" role="tabpanel" aria-labelledby="tab-denuncias" hidden></section>

    <div class="previa-tema" id="previa-tema" role="status" hidden>
      <span></span>
      <button type="button" class="btn btn-secondary" id="btn-desfazer-previa">Voltar ao meu tema</button>
    </div>

  </main>

  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/perfil.js"></script>

</body>
</html>
