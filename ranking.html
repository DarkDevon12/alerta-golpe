<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking — AlertaGolpe</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark"><svg class="icon" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg></span>
        AlertaGolpe
      </a>
      <nav class="nav">
        <a href="index.html"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>Verificar</a>
        <a href="denunciar.html"><svg class="icon" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>Denunciar</a>
        <a href="ranking.html" aria-current="page"><svg class="icon" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Ranking</a>
      </nav>
      <div class="topbar-user">
        <span id="nav-usuario"></span>
        <button id="btn-sair" class="btn-sair" type="button"><svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>Sair</button>
      </div>
    </div>
  </header>

  <main class="page">

    <div class="page-head ranking-head">
      <div>
        <span class="eyebrow">Comunidade</span>
        <h1>Ranking de protetores</h1>
        <p>Quem mais ajudou a expor golpes. Cada denúncia enviada vale 3 XP.</p>
      </div>
      <div class="ranking-stats">
        <div><b id="stat-membros">–</b><span>membros</span></div>
        <div><b id="stat-denuncias">–</b><span>denúncias</span></div>
      </div>
    </div>

    <section class="card meu-card" id="meu-card" hidden></section>

    <section class="podio" id="podio" hidden></section>

    <section class="card placar">
      <div class="placar-cab" aria-hidden="true">
        <span>#</span>
        <span>Membro</span>
        <span>Denúncias</span>
        <span>XP</span>
      </div>
      <ol class="placar-lista" id="ranking-lista">
        <li class="placar-msg">Carregando ranking…</li>
      </ol>
    </section>

  </main>

  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/ranking.js"></script>

</body>
</html>
