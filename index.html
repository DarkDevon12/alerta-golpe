<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlertaGolpe</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">

    <header class="header">
      <h1>AlertaGolpe</h1>
      <p>Verifique se um número ou link é suspeito</p>
    </header>

    <main class="main">
      <div class="search-box">
        <input type="text" id="inputBusca" placeholder="Digite telefone ou link">
        <button id="btnBuscar" class="btn-primary">Verificar</button>
      </div>
    </main>

    <footer class="footer">
      <a href="denunciar.html">Reportar golpe</a>
      <span class="separator">•</span>
      <a href="ranking.html">Ranking</a>
      <button id="btn-sair" class="btn-sair">Sair</button>
    </footer>

  </div>

  <script type="module">
    import { protegerRota } from "./js/route-guard.js";
    import { auth, signOut } from "./js/firebase.js";
    
    protegerRota();

    document.getElementById("btn-sair").addEventListener("click", async () => {
      try {
        await signOut(auth);
        window.location.href = "login.html";
      } catch (error) {
        alert("Erro ao sair: " + error.message);
      }
    });
  </script>

  <script type="module" src="js/main.js"></script>

</body>
</html>
